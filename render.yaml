databases:
  - name: kaveri-db
    databaseName: kaveri
    user: kaveri_user
    plan: free
    region: oregon

services:
  - type: web
    name: kaveri-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: ./render_build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kaveri-db
          property: connectionString
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: ALGORITHM
        value: "HS256"
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: CORS_ORIGINS
        value: "https://vercel.app,http://localhost:3000,http://127.0.0.1:3000"
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app|http://localhost:\\d+|http://127\\.0\\.0\\.1:\\d+"
